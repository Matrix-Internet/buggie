# Security fixes should not wait on somebody noticing them. Grouped and weekly so the
# pull requests arrive as one batch per ecosystem rather than a steady drip.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly }
    groups:
      composer: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /packages/widget
    schedule: { interval: monthly }

  - package-ecosystem: gradle
    directory: /packages/kotlin
    schedule: { interval: monthly }

  - package-ecosystem: docker
    directory: /docker/php
    schedule: { interval: monthly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
