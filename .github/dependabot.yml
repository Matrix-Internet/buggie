# Security fixes should not wait on somebody noticing them. Every ecosystem is grouped,
# so updates arrive as one pull request per ecosystem per interval, not a steady drip.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule: { interval: weekly }
    groups:
      composer: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /packages/widget
    schedule: { interval: monthly }
    groups:
      widget-loader: { patterns: ["*"] }

  - package-ecosystem: gradle
    directory: /packages/kotlin
    schedule: { interval: monthly }
    groups:
      android-sdk: { patterns: ["*"] }

  - package-ecosystem: docker
    directory: /docker/php
    schedule: { interval: monthly }
    groups:
      images: { patterns: ["*"] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
