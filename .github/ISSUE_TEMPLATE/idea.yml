name: Idea
description: Something Buggie should do, or do differently.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Worth reading [ROADMAP.md](https://github.com/bpowerie25/buggie/blob/main/ROADMAP.md)
        first: it lists what is next and, as usefully, what is deliberately not coming and why.
        Things get built when they are asked for twice, so a 👍 on an existing idea counts.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and where Buggie gets in the way. The problem matters more than a proposed solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: now
    attributes:
      label: What you do today instead
